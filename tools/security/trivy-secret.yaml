# Trivy secret-scanner config: built-in rules + project-specific rules.
# Keep the regex identical to .gitleaks.toml and .claude/hooks/guard_git.py.
rules:
  - id: cxufo-api-key
    category: CoreXY UFO
    title: CoreXY UFO in-house API key
    severity: CRITICAL
    regex: \bcxufo_(?:live|test)_[A-Za-z0-9]{32}\b
    keywords:
      - cxufo_
