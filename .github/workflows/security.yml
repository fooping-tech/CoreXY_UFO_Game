name: Security

# Required checks for merging into main (see docs/SECURITY.md, .github/rulesets/main.json).
# Every job only reads the repository: no secrets, no write token, no PR comments.
# Reports never contain secret values (tools/security/report.py prints file / rule / line).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * 1"   # weekly: new CVEs in existing dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden:
    name: "security: forbidden files + exceptions"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tools/security/scan.sh forbidden
      - run: tools/security/scan.sh exceptions

  gitleaks:
    name: "security: gitleaks (full history)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit of every fetched ref
      - uses: actions/cache@v4
        with:
          path: tools/.bin
          key: security-tools-${{ runner.os }}-${{ hashFiles('tools/security/install_tools.sh') }}
      - run: tools/security/install_tools.sh
      - run: tools/security/scan.sh history

  trivy:
    name: "security: trivy (${{ matrix.scan }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scan: [secret, vuln, config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.bin
          key: security-tools-${{ runner.os }}-${{ hashFiles('tools/security/install_tools.sh') }}
      - name: Date for the vulnerability DB cache
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: tools/security/install_tools.sh
      - run: tools/security/scan.sh trivy-${{ matrix.scan }}

  selftest:
    name: "security: scanner self-test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools/.bin
          key: security-tools-${{ runner.os }}-${{ hashFiles('tools/security/install_tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-selftest-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: tools/security/install_tools.sh
      # The scanners must FAIL on dummy secrets / a vulnerable dependency / a bad Dockerfile.
      - run: tools/security/scan.sh selftest
