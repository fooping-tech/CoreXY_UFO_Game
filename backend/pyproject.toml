[project]
name = "corexy-ufo-backend"
version = "0.1.0"
description = "Hardware + vision backend for the CoreXY UFO game (M5Stack Core2 CoreXY crane over USB serial, WebSocket/JSON to Godot)."
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "websockets>=13.0",
    "numpy>=1.26",
    # the study mode finds the worksheet's corner marks in the overview frame (#116)
    "opencv-python>=4.9",
    # the peripherals' hub (UFO-DeviceHub's PC client: gateway, protocol, mock hub), #159
    "ufo-devicehub",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.9"]
hands = ["mediapipe>=0.10.14"]
yolo = ["ultralytics>=8.2"]

[project.scripts]
corexy-ufo-backend = "corexy_ufo_backend.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# UFO-DeviceHub is its own repository, cloned to external/UFO-DeviceHub/ by
# tools/setup_devicehub.sh (not a submodule, not a copy: #159). Editable: an edit there is seen
# the next time the backend starts, without uv sync. The commit this game is verified with is
# tools/devicehub.pin. Phase 2 of #159 replaces this path by a fixed version.
[tool.uv.sources]
ufo-devicehub = { path = "../external/UFO-DeviceHub", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corexy_ufo_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
